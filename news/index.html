<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お知らせ | STORY 川口市木曽呂</title>
<meta name="description" content="お食事処STORYのお知らせ・新着情報。PayPay対応・宴会プラン・Uber Eats出店情報など。">
<meta property="og:title" content="お知らせ | STORY 川口市木曽呂">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ff9ecd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Cormorant+Garamond:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="news">
<div id="site-header"></div>

<main id="main-content">
  <nav class="breadcrumb" aria-label="パンくずリスト">
    <a href="../index.html">STORY</a><span>›</span> お知らせ
  </nav>

  <section class="page-hero">
    <h1>📰 お知らせ</h1>
    <p>STORYの最新情報・更新情報はこちら</p>
  </section>

  <section style="padding:60px 5% 80px;">
    <div class="news-list-full" id="news-list-container">
      <p style="text-align:center;color:var(--brown);padding:40px;">読み込み中...</p>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('news-list-container');
  if (!container || typeof NEWS_LIST === 'undefined') return;

  container.innerHTML = NEWS_LIST.map(item => `
    <a href="${item.file}" class="news-list-card fade-up">
      <div class="news-list-card-meta">
        <span class="news-list-card-date">${item.date}</span>
        <span class="news-badge ${item.badgeClass || ''}">${item.badge}</span>
      </div>
      <div class="news-list-card-body">
        <div class="news-list-card-title">${item.title}</div>
        <div class="news-list-card-summary">${item.summary}</div>
      </div>
      <span style="color:var(--amber);font-size:1.2rem;flex-shrink:0;" aria-hidden="true">›</span>
    </a>
  `).join('');
});
</script>
</body>
</html>
